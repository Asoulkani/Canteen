<section class="page">
  <header class="page-header">
    <h1>Today's menu</h1>
    <p class="page-subtitle">Pick a dish to order</p>
  </header>

  <form class="menu-toolbar" [formGroup]="formSearch" (submit)="$event.preventDefault()">
    <div class="menu-search">
      <label class="visually-hidden" for="searchQuery">Search dishes</label>
      <input
        type="search"
        id="searchQuery"
        formControlName="searchQuery"
        placeholder="Search dishes…"
        autocomplete="off"
      />
    </div>

    <label class="veg-toggle" for="vegOnly">
      <input type="checkbox" id="vegOnly" formControlName="vegOnly" />
      Vegetarian only
    </label>
  </form>

  @if (dishesService.filteredDishes().length === 0) {
    <p class="menu-empty">No dishes match your search.</p>
  } @else {
    <div class="menu-grid">
      @for (dish of dishesService.filteredDishes(); track dish.name) {
        <app-dish-card [dish]="dish" />
      }
    </div>
  }
</section>
